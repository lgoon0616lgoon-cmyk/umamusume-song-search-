<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>サイト更新</title><style>body{font-family:system-ui,"Yu Gothic UI",sans-serif;background:#f4f7f9;color:#23313b;margin:0}.box{max-width:620px;margin:50px auto;background:#fff;padding:26px;border-radius:16px;box-shadow:0 8px 28px #20304018}h1{margin-top:0}label{display:block;font-weight:700;margin:16px 0 6px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd8df;border-radius:10px;font-size:16px}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:10px;background:#3fa769;color:white;font-weight:800;font-size:16px;cursor:pointer}.note{background:#eef8f1;padding:12px;border-radius:10px;color:#42604d}.status{margin-top:18px;white-space:pre-wrap}.err{color:#b52c2c}.ok{color:#227744}a{color:#278154}</style></head><body><div class="box"><h1>ウマ娘歌唱サイト 更新</h1><p class="note">新しいExcelを選択して更新すると、公開URLを変更せず全データ・画像を差し替えます。更新前Excelはバックアップされます。</p><form id="f"><label>管理パスワード</label><input name="password" type="password" required><label>更新するExcel (.xlsx)</label><input name="excel" type="file" accept=".xlsx" required><button>サイトを更新</button></form><div id="status" class="status"></div><p><a href="/">← 公開サイトへ戻る</a></p></div><script>const f=document.getElementById('f'),s=document.getElementById('status');f.onsubmit=async e=>{e.preventDefault();s.className='status';s.textContent='更新処理中…';const b=f.querySelector('button');b.disabled=true;try{const r=await fetch('/api/admin/update',{method:'POST',body:new FormData(f)});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'更新失敗');s.className='status ok';s.textContent=`${j.message}\nウマ娘 ${j.umas}名 / 楽曲 ${j.songs}曲\n画像 ${j.umaImages+j.songImages}枚`; }catch(err){s.className='status err';s.textContent=err.message}finally{b.disabled=false}};</script></body></html>
